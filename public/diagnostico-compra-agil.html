<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagnóstico Compra Ágil</title>
<style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;padding:16px;background:#f7f8fa;color:#0f172a}button{display:block;width:100%;min-height:48px;margin:8px 0;border:0;border-radius:10px;background:#14b8a6;color:#fff;font-weight:800;font-size:15px}button.sec{background:#fff;color:#0d9488;border:1px solid #14b8a6}pre{white-space:pre-wrap;word-break:break-word;background:#fff;border:1px solid #e2e5eb;border-radius:10px;padding:12px;font-size:12px}p{font-size:14px;line-height:1.45}</style></head>
<body>
<h2>Diagnóstico Compra Ágil (vista previa temporal)</h2>
<p>Solo administradores. Primero inicia sesión en BFK Datos en esta misma vista previa; luego vuelve a esta página. No guarda nada.</p>
<button id="red">1. Probar red (DNS, TCP, TLS, API sin ticket)</button>
<button id="cmp">3. Comparar listado y detalle con el ticket (usa 2 consultas de la cuota)</button>
<pre id="out">Sin resultados.</pre>
<script>
const out = document.getElementById("out");
async function correr(modo) {
  let token = ""; try { token = JSON.parse(localStorage.getItem("bfk_supabase_session_v2") || "null")?.access_token || ""; } catch {}
  if (!token) { out.textContent = "No hay sesión: abre la aplicación en esta vista previa, inicia sesión y vuelve."; return; }
  out.textContent = "Probando… (máximo 25 segundos)";
  try {
    const r = await fetch("/api/compra-agil?diagnostico=1" + (modo ? "&ticket=" + modo : ""), { headers: { Authorization: "Bearer " + token } });
    const j = await r.json().catch(() => ({}));
    out.textContent = "HTTP " + r.status + "\n" + JSON.stringify(j, null, 2);
  } catch (e) { out.textContent = "Error: " + e.message; }
}
document.getElementById("red").onclick = () => correr("");
document.getElementById("cmp").onclick = () => correr("comparar");
</script>
</body></html>
